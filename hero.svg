<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#0f2027"/>
      <stop offset="100%" stop-color="#0a0e17"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;0%;100%" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00c9a7"/>
      <stop offset="100%" stop-color="#4dd8ff"/>
    </linearGradient>
    <clipPath id="typeClip">
      <rect x="0" y="0" width="0" height="115">
        <animate attributeName="width" values="0;560;560;560;0;0" keyTimes="0;0.28;0.55;0.75;0.85;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="300" fill="url(#bg)"/>

  <!-- faint neural grid backdrop -->
  <g stroke="#1c3b3a" stroke-width="1" opacity="0.6">
    <line x1="60" y1="230" x2="180" y2="190"/>
    <line x1="180" y1="190" x2="300" y2="235"/>
    <line x1="300" y1="235" x2="420" y2="185"/>
    <line x1="60" y1="230" x2="300" y2="235"/>
    <line x1="720" y1="255" x2="820" y2="230"/>
    <line x1="720" y1="255" x2="800" y2="275"/>
  </g>
  <g fill="#00c9a7">
    <circle cx="60" cy="230" r="4"><animate attributeName="r" values="4;7;4" dur="2s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="190" r="4"><animate attributeName="r" values="4;7;4" dur="2s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="235" r="4"><animate attributeName="r" values="4;7;4" dur="2s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="185" r="4"><animate attributeName="r" values="4;7;4" dur="2s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="255" r="4"><animate attributeName="r" values="4;7;4" dur="2s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="230" r="4"><animate attributeName="r" values="4;7;4" dur="2s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="275" r="4"><animate attributeName="r" values="4;7;4" dur="2s" begin="0.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- typewriter title -->
  <g clip-path="url(#typeClip)">
    <text x="60" y="90" font-family="Consolas, 'Courier New', monospace" font-size="46" font-weight="700" fill="url(#accent)" filter="url(#glow)">
      &gt; Pruthil Prajapati_
    </text>
  </g>

  <!-- blinking cursor -->
  <rect x="618" y="52" width="4" height="42" fill="#00c9a7">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>

  <!-- subtitle: single static line, kept simple so it can never overlap/garble regardless of renderer -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="19" fill="#c9d6d3">
    <text x="62" y="140">Agentic RAG &amp; Multi-Agent Systems · GATE 2026 AIR 1718 · CPI 8.44</text>
  </g>

  <!-- GATE badge -->
  <g transform="translate(700,60)">
    <rect x="-6" y="-26" width="185" height="42" rx="21" fill="none" stroke="#00c9a7" stroke-width="1.5" opacity="0.9">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <text x="86" y="1" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#00c9a7">🎓 GATE AIR 1718</text>
  </g>

  <!-- status pill filling the space where the glove used to be -->
  <g transform="translate(700,200)">
    <rect x="-6" y="-24" width="196" height="42" rx="21" fill="none" stroke="#00c9a7" stroke-width="1.5" opacity="0.9">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <circle cx="10" cy="-3" r="5" fill="#3ddc84"/>
    <text x="26" y="1" font-family="Consolas, monospace" font-size="14" fill="#c9d6d3">Open to Product-Based AI Roles</text>
  </g>
</svg>
